<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>
    <style>
        :root {
            --primary: #7c5dfa;
            --primary-hover: #6c48f9;
            --bg-color: #f3f0ff;
            --card-bg: #ffffff;
            --text-main: #2b2738;
            --text-muted: #8c829e;
            --border-color: #e6e1f7;
            --shadow: 0 10px 30px rgba(124, 93, 250, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h2 {
            font-size: 2rem;
            color: #4a3e7d;
            font-weight: 700;
        }

        .dashboard-container {
            display: flex;
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .form-panel, .table-panel {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .form-panel {
            flex: 1;
            height: fit-content;
        }

        .table-panel {
            flex: 2;
        }

        h3 {
            margin-bottom: 20px;
            font-size: 1.25rem;
            color: #4a3e7d;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fcfaff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 93, 250, 0.15);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        th {
            background-color: #faf8ff;
            color: #635780;
            font-weight: 600;
        }

        tbody tr:hover {
            background-color: #f9f7ff;
        }

        .empty-cell {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Student Management Dashboard</h2>
    </div>

    <div class="dashboard-container">
        <div class="form-panel">
            <h3>Add New Student</h3>
            <form id="studentForm">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" placeholder="e.g. Viktor" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" placeholder="e.g. Magtatanggol" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="viktor.magtatanggol@example.com" required>
                </div>
                <button type="submit">Submit Record</button>
            </form>
        </div>

        <div class="table-panel">
            <h3>Registered Students</h3>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Direct imports via ES module -->
    <script src="app.js" type="module"></script>
</body>
</html>
