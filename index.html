<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lavender: {
                            50: '#f8f5fe',
                            100: '#f3eefc',
                            200: '#e5d8f9',
                            300: '#ceb7f4',
                            400: '#b08beb',
                            500: '#8f5be0',
                            600: '#6c5ce7',
                            700: '#5b4bc4',
                            800: '#4a3da1',
                            900: '#2b235d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3eefc;
            color: #2b235d;
            min-height: 100vh;
        }

        .lavender-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(206, 183, 244, 0.5);
            box-shadow: 0 10px 25px -5px rgba(108, 92, 231, 0.08), 0 8px 10px -6px rgba(108, 92, 231, 0.04);
            border-radius: 16px;
        }

        .lavender-input {
            transition: all 0.2s ease-in-out;
            background-color: #f8f5fe;
            border: 1.5px solid #e5d8f9;
        }

        .lavender-input:focus {
            outline: none;
            background-color: #ffffff;
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3.5px rgba(108, 92, 231, 0.18);
        }

        .btn-violet {
            background: linear-gradient(135deg, #6c5ce7 0%, #5b4bc4 100%);
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.25);
        }

        .btn-violet:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(108, 92, 231, 0.35);
            background: linear-gradient(135deg, #5b4bc4 0%, #4a3da1 100%);
        }

        .btn-violet:active {
            transform: translateY(0);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f3eefc;
        }
        ::-webkit-scrollbar-thumb {
            background: #ceb7f4;
            border-radius: 6px;
        }

        .table-row-animate {
            transition: all 0.2s ease;
        }
        .table-row-animate:hover {
            background-color: #f8f5fe;
        }
    </style>
</head>
<body class="p-4 md:p-8 relative">

    <div class="max-w-6xl mx-auto space-y-6">

        <!-- Top Banner -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 lavender-card p-6 md:p-8">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-lavender-600 to-lavender-700 flex items-center justify-center text-white shadow-lg shadow-lavender-600/30">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-lavender-900 tracking-tight">Student Management Dashboard</h1>
                    <p class="text-xs md:text-sm text-lavender-600 font-medium mt-0.5">Directory & Registration System</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    API Connected
                </span>
            </div>
        </header>

        <!-- Stats Overview Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="lavender-card p-5 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-lavender-100 text-lavender-600 flex items-center justify-center font-bold">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-bold uppercase tracking-wider text-lavender-500">Total Students</p>
                    <h3 id="statTotalCount" class="text-2xl font-bold text-lavender-900 mt-0.5">0</h3>
                </div>
            </div>

            <div class="lavender-card p-5 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center font-bold">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-bold uppercase tracking-wider text-lavender-500">Active Records</p>
                    <h3 class="text-2xl font-bold text-lavender-900 mt-0.5">100%</h3>
                </div>
            </div>

            <div class="lavender-card p-5 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-bold uppercase tracking-wider text-lavender-500">Display Count</p>
                    <h3 id="statDisplayCount" class="text-2xl font-bold text-lavender-900 mt-0.5">0</h3>
                </div>
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

            <!-- Left Form Panel -->
            <div class="lg:col-span-4 lavender-card p-6 md:p-7 space-y-5">
                <div class="border-b border-lavender-200/80 pb-4">
                    <h2 class="text-lg font-bold text-lavender-900 flex items-center gap-2">
                        <svg class="w-5 h-5 text-lavender-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                        </svg>
                        Add New Student
                    </h2>
                    <p class="text-xs text-lavender-600/80 mt-1">Submit information to create a new record.</p>
                </div>

                <form id="studentForm" class="space-y-4">
                    <div>
                        <label for="firstName" class="block text-xs font-bold text-lavender-900 uppercase tracking-wider mb-1.5">First Name</label>
                        <input type="text" id="firstName" placeholder="e.g. Viktor" 
                            class="lavender-input w-full px-4 py-2.5 rounded-xl text-sm text-lavender-900 placeholder-lavender-400 font-medium">
                    </div>

                    <div>
                        <label for="lastName" class="block text-xs font-bold text-lavender-900 uppercase tracking-wider mb-1.5">Last Name</label>
                        <input type="text" id="lastName" placeholder="e.g. Magtatanggol" 
                            class="lavender-input w-full px-4 py-2.5 rounded-xl text-sm text-lavender-900 placeholder-lavender-400 font-medium">
                    </div>

                    <div>
                        <label for="email" class="block text-xs font-bold text-lavender-900 uppercase tracking-wider mb-1.5">Email</label>
                        <input type="email" id="email" placeholder="viktor.magtatanggol@example.com" 
                            class="lavender-input w-full px-4 py-2.5 rounded-xl text-sm text-lavender-900 placeholder-lavender-400 font-medium">
                    </div>

                    <button type="submit" class="btn-violet w-full py-3 px-4 rounded-xl text-white text-sm font-semibold flex items-center justify-center gap-2 mt-2 cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                        </svg>
                        Submit Record
                    </button>
                </form>
            </div>

            <!-- Right Table Panel -->
            <div class="lg:col-span-8 lavender-card p-6 md:p-7 space-y-4">
                
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2">
                    <div>
                        <h2 class="text-lg font-bold text-lavender-900">Registered Students</h2>
                        <p class="text-xs text-lavender-600/80">Search and view current student directory.</p>
                    </div>

                    <!-- Search Filter -->
                    <div class="relative w-full sm:w-64">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-lavender-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </span>
                        <input type="text" id="tableSearch" placeholder="Filter by name or email..." 
                            class="lavender-input w-full pl-9 pr-3 py-2 rounded-xl text-xs text-lavender-900 placeholder-lavender-400 font-medium">
                    </div>
                </div>

                <!-- Table Container -->
                <div class="overflow-x-auto rounded-xl border border-lavender-200/80 bg-white/70">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-lavender-100/80 text-lavender-900 text-xs font-bold uppercase tracking-wider border-b border-lavender-200">
                                <th class="py-3.5 px-4 w-12 text-center">#</th>
                                <th class="py-3.5 px-4">First Name</th>
                                <th class="py-3.5 px-4">Last Name</th>
                                <th class="py-3.5 px-4">Email</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody" class="divide-y divide-lavender-100 text-xs md:text-sm">
                            <!-- Populated dynamically via JS module logic -->
                        </tbody>
                    </table>
                </div>

            </div>

        </div>
    </div>

    <!-- ES Module Script -->
    <script type="module">
        // Import API handlers from ./api.js with a fallback mock implementation for iframe context
        let getStudentsAPI, addStudentsAPI;

        try {
            const apiModule = await import("./api.js");
            getStudentsAPI = apiModule.getStudentsAPI;
            addStudentsAPI = apiModule.addStudentsAPI;
        } catch (err) {
            console.warn("Could not load external ./api.js. Using mock API fallback.", err);
            
            // Mock API data store fallback
            let mockDatabase = [
                { firstName: "Viktor", lastName: "Magtatanggol", email: "viktor.magtatanggol@example.com" },
                { firstName: "Sophia", lastName: "Reyes", email: "sophia.reyes@example.com" },
                { firstName: "Liam", lastName: "Cruz", email: "liam.cruz@example.com" }
            ];

            getStudentsAPI = () => [...mockDatabase];
            addStudentsAPI = (student) => {
                mockDatabase.push(student);
            };
        }

        // State & DOM Elements
        let localStudents = [];

        const studentForm = document.getElementById("studentForm");
        const studentTableBody = document.getElementById("studentTableBody");
        const firstNameInput = document.getElementById("firstName");
        const lastNameInput = document.getElementById("lastName");
        const emailInput = document.getElementById("email");
        const statTotalCount = document.getElementById("statTotalCount");
        const statDisplayCount = document.getElementById("statDisplayCount");
        const tableSearch = document.getElementById("tableSearch");

        // Helper to update counters
        const updateStats = (displayedLength) => {
            if (statTotalCount) statTotalCount.textContent = localStudents.length;
            if (statDisplayCount) statDisplayCount.textContent = displayedLength;
        };

        // Render Table Function
        const renderTable = (dataArray) => {
            studentTableBody.innerHTML = "";

            if (!dataArray || dataArray.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = 4;
                cell.className = "py-8 text-center text-lavender-500 font-medium text-sm";
                cell.textContent = "No student records found.";
                row.appendChild(cell);
                studentTableBody.appendChild(row);
                updateStats(0);
                return;
            }

            dataArray.forEach((student, index) => {
                const row = document.createElement("tr");
                row.className = "table-row-animate border-b border-lavender-100/80";

                // Generate soft visual avatar initials for first column item
                const initials = `${(student.firstName || '').charAt(0)}${(student.lastName || '').charAt(0)}`.toUpperCase();

                [index + 1, student.firstName, student.lastName, student.email].forEach((value, idx) => {
                    const cell = document.createElement("td");
                    cell.className = "py-3.5 px-4 font-medium text-lavender-900";
                    
                    if (idx === 0) {
                        cell.className += " text-center font-bold text-lavender-400 text-xs";
                        cell.textContent = value;
                    } else if (idx === 1) {
                        cell.innerHTML = `
                            <div class="flex items-center gap-2.5">
                                <div class="w-7 h-7 rounded-full bg-lavender-200 text-lavender-700 font-bold text-xs flex items-center justify-center">
                                    ${initials || 'S'}
                                </div>
                                <span class="font-semibold text-lavender-900">${escapeHtml(value)}</span>
                            </div>
                        `;
                    } else if (idx === 3) {
                        cell.className += " text-lavender-600/90";
                        cell.textContent = value;
                    } else {
                        cell.textContent = value;
                    }

                    row.appendChild(cell);
                });

                studentTableBody.appendChild(row);
            });

            updateStats(dataArray.length);
        };

        // Escaper helper to prevent code injection
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[m]);
        }

        // Form Submit Listener
        studentForm.addEventListener("submit", (event) => {
            event.preventDefault(); 

            const studentData = {
                firstName: firstNameInput.value.trim(),
                lastName: lastNameInput.value.trim(),
                email: emailInput.value.trim(),
            };

            if (!studentData.firstName || !studentData.lastName || !studentData.email) {
                alert("Please fill out all input fields!");
                return;
            }

            addStudentsAPI(studentData); 
            localStudents = getStudentsAPI(); 
            renderTable(localStudents); 

            studentForm.reset(); 
        });

        // Search Filter Event
        if (tableSearch) {
            tableSearch.addEventListener("input", (e) => {
                const term = e.target.value.toLowerCase().trim();
                const filtered = localStudents.filter(s => 
                    (s.firstName && s.firstName.toLowerCase().includes(term)) ||
                    (s.lastName && s.lastName.toLowerCase().includes(term)) ||
                    (s.email && s.email.toLowerCase().includes(term))
                );
                renderTable(filtered);
            });
        }

        // Initialization
        const initApp = () => {
            localStudents = getStudentsAPI();
            renderTable(localStudents);
        };

        initApp();
    </script>
</body>
</html>
